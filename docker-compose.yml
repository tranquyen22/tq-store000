version: '3.8'

services:
  # 1. PostgreSQL 15 + PostGIS Extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: tq_postgres_postgis
    restart: always
    environment:
      POSTGRES_USER: tq_admin
      POSTGRES_PASSWORD: tq_secret_password_2026
      POSTGRES_DB: tq_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tq_admin -d tq_platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Pub/Sub & Caching Engine)
  redis:
    image: redis:7-alpine
    container_name: tq_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice --requirepass tq_redis_secret
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tq_redis_secret", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO S3 Object Storage (Media Assets & Product Images)
  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    container_name: tq_minio_s3
    restart: always
    environment:
      MINIO_ROOT_USER: tq_minio_admin
      MINIO_ROOT_PASSWORD: tq_minio_secret_key_2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
