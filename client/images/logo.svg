<svg width="320" height="120" viewBox="0 0 400 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dynamic Blue Ribbon Gradients -->
    <linearGradient id="tqGradMain" x1="15%" y1="10%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0369a1" />
      <stop offset="80%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="tqGradHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="tqGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#tqGlow)">
    <!-- Letter T Structure: Continuous rounded ribbon -->
    <!-- Top Horizontal Bar of T -->
    <path d="M 45 42 H 105 C 122 42 135 55 135 72 C 135 92 120 108 100 108 C 80 108 65 92 65 72" 
          stroke="url(#tqGradHighlight)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Slanted Stem of T -->
    <path d="M 68 42 L 52 102 C 50 109 43 114 35 114 C 27 114 20 107 20 98 C 20 92 24 86 28 72 L 35 42" 
          stroke="url(#tqGradMain)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter Q Loop: Overlapping seamless circle -->
    <circle cx="102" cy="72" r="28" stroke="url(#tqGradMain)" stroke-width="14" stroke-linecap="round"/>

    <!-- Q Ribbon Wave Tail -->
    <path d="M 98 88 C 108 94 118 104 132 104 C 138 104 142 98 138 92 C 132 84 115 78 102 82" 
          fill="url(#tqGradHighlight)"/>
  </g>
</svg>
